# CI for jhwiv/trip-optimizer
#
# Runs on:
#   - every push to master (so master is always known-good)
#   - every pull request targeting master (so we know before merge)
#
# Three jobs in parallel for fast feedback:
#   1. test  — runs the offline unit suites (npm test)
#   2. lint  — runs eslint (npm run lint)
#   3. build — verifies the Vite production build still compiles
#
# Lint is a HARD GATE — PR-B cleared the baseline 14 errors. Any PR that
# reintroduces a lint error will fail this job and block merge. Justified
# false-positives must be silenced with a per-line eslint-disable comment
# AND a brief justification.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs on the same ref so a rapid push series doesn't
# pile up runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  build:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
