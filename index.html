<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="Trip Optimizer — Powered by Barrier Island Digital" />
    <title>Trip Optimizer</title>
    <style>
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        --font-serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        --color-background-primary: #FFFFFF;
        --color-background-secondary: #F2EFEA;
        --color-text-primary: #0F0F0F;
        --color-text-secondary: #3D3D3D;
        --color-text-tertiary: #6A6A6A;
        --color-text-danger: #B23A2A;
        --color-border-primary: #6A6A6A;
        --color-border-secondary: #B8B3AA;
        --color-border-tertiary: #D8D3C9;
        --border-radius-md: 4px;
        --border-radius-lg: 6px;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      /* Aggressive horizontal containment for iOS Chrome.
         html, body, AND #root all clip horizontally so no descendant can
         force a horizontal scroll, even when transforms or absolute positioning
         try to escape. position: relative on root is required for clip to work
         on iOS as a containing block. */
      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        overscroll-behavior-x: none;
      }
      body {
        font-family: var(--font-sans);
        background: #F4F2EE;
        color: var(--color-text-primary);
        min-height: 100vh;
        -webkit-text-size-adjust: 100%;
        overflow-wrap: break-word;
        word-wrap: break-word;
      }
      #root {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        position: relative;
      }
      /* Prevent any long word/URL from blowing out a container and shifting layout */
      p, span, label, h1, h2, h3, h4, div {
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      input, select, button, textarea {
        font-family: inherit;
        color: var(--color-text-primary);
        max-width: 100%;
      }
      /* iOS Safari date input refuses to shrink below its intrinsic width;
         strip native appearance and force it to fit the grid column. */
      input[type="date"] {
        -webkit-appearance: none;
        appearance: none;
        min-width: 0;
        width: 100%;
      }
      input::placeholder {
        font-style: italic;
        color: #8C8880;
      }
      /* Native date picker calendar icon — give it a clear gold tint and pointer cursor */
      input[type="date"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
        opacity: 0.85;
        filter: invert(64%) sepia(34%) saturate(560%) hue-rotate(8deg) brightness(92%) contrast(88%);
      }
      input[type="date"] {
        min-height: 22px;
      }
      /* Autocomplete dropdown */
      .city-suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #FFFFFF;
        border: 0.5px solid var(--color-border-secondary);
        border-radius: var(--border-radius-md);
        margin-top: 4px;
        max-height: 240px;
        overflow-y: auto;
        z-index: 50;
        box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      }
      .city-suggestion {
        padding: 9px 12px;
        font-size: 13px;
        cursor: pointer;
        color: var(--color-text-primary);
        border-bottom: 0.5px solid var(--color-border-tertiary);
      }
      .city-suggestion:last-child { border-bottom: none; }
      .city-suggestion:hover, .city-suggestion.active {
        background: #F5EDD6;
        color: #0F0F0F;
      }
      .city-suggestion .country {
        color: var(--color-text-tertiary);
        font-size: 11px;
        margin-left: 6px;
      }
      @keyframes slideBar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      /* Print: hide controls, show the input summary, force colors. */
      @media print {
        html, body { background: #fff !important; overflow: visible !important; }
        body { font-size: 11px; }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .pageBreakAvoid, .day-block, .meal-card, .flight-card, .hotel-card { break-inside: avoid; page-break-inside: avoid; }
        a { color: #000 !important; text-decoration: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
