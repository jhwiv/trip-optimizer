<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="Trip Optimizer — Powered by Barrier Island Digital" />

    <!-- PWA: installable home-screen app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c6a25a" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <!-- iOS-specific: standalone mode + status bar styling -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trip" />

    <title>Route Smith</title>
    <style>
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        --font-serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        --color-background-primary: #FFFFFF;
        --color-background-secondary: #f8f7f3;
        --color-text-primary: #1c2840;
        --color-text-secondary: #5b6577;
        --color-text-tertiary: #9aa1ad;
        --color-text-danger: #9b3a2e;
        --color-border-primary: #5b6577;
        --color-border-secondary: #dcd8cf;
        --color-border-tertiary: #e6e3da;

        /* BID core additions */
        --color-accent: #3f7d86;
        --color-accent-hover: #316169;
        --color-gold: #c6a25a;
        --color-cream: #f0e6cf;
        --color-surface-2: #f2f0ea;
        --color-surface-offset: #eceae3;

        /* Semantic states */
        --color-warning: #874a14;
        --color-warning-hover: #7a3d00;
        --color-warning-tint: #f1e3cf;
        --color-danger-hover: #7e2a23;
        --color-danger-tint: #f3e0db;

        /* Badge categoricals */
        --color-info: #2f5d83;
        --color-info-tint: #e5edf5;
        --color-success: #446b54;
        --color-success-tint: #e3ede6;
        --color-category-purple: #6b4a7d;
        --color-category-purple-tint: #ede8f1;
        --color-category-rose: #8a4760;
        --color-category-rose-tint: #f0e3e9;

        --border-radius-md: 4px;
        --border-radius-lg: 6px;
      }
      :root[data-theme="dark"] {
        --color-background-primary: #171c28;
        --color-background-secondary: #10141d;
        --color-text-primary: #e7e9ee;
        --color-text-secondary: #9aa3b4;
        --color-text-tertiary: #5f6878;
        --color-text-danger: #d97565;
        --color-border-primary: #9aa3b4;
        --color-border-secondary: #2c3344;
        --color-border-tertiary: #262d3b;
        --color-accent: #5fa3ac;
        --color-accent-hover: #79bcc5;
        --color-gold: #d8b772;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      /* Aggressive horizontal containment for iOS Chrome.
         html, body, AND #root all clip horizontally so no descendant can
         force a horizontal scroll, even when transforms or absolute positioning
         try to escape. position: relative on root is required for clip to work
         on iOS as a containing block. */
      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        overscroll-behavior-x: none;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-background-secondary);
        color: var(--color-text-primary);
        min-height: 100vh;
        -webkit-text-size-adjust: 100%;
        overflow-wrap: break-word;
        word-wrap: break-word;
      }
      #root {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        position: relative;
      }
      /* Prevent any long word/URL from blowing out a container and shifting layout */
      p, span, label, h1, h2, h3, h4, div {
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      input, select, button, textarea {
        font-family: inherit;
        color: var(--color-text-primary);
        max-width: 100%;
      }
      /* iOS Safari date input refuses to shrink below its intrinsic width;
         strip native appearance and force it to fit the grid column. */
      input[type="date"] {
        -webkit-appearance: none;
        appearance: none;
        min-width: 0;
        width: 100%;
      }
      input::placeholder {
        font-style: italic;
        color: var(--color-text-tertiary);
      }
      /* Native date picker calendar icon — give it a clear gold tint and pointer cursor */
      input[type="date"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
        opacity: 0.85;
        filter: invert(64%) sepia(34%) saturate(560%) hue-rotate(8deg) brightness(92%) contrast(88%);
      }
      input[type="date"] {
        min-height: 22px;
      }
      /* Autocomplete dropdown */
      .city-suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--color-background-primary);
        border: 0.5px solid var(--color-border-secondary);
        border-radius: var(--border-radius-md);
        margin-top: 4px;
        max-height: 240px;
        overflow-y: auto;
        z-index: 50;
        box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      }
      .city-suggestion {
        padding: 9px 12px;
        font-size: 13px;
        cursor: pointer;
        color: var(--color-text-primary);
        border-bottom: 0.5px solid var(--color-border-tertiary);
      }
      .city-suggestion:last-child { border-bottom: none; }
      .city-suggestion:hover, .city-suggestion.active {
        background: var(--color-cream);
        color: var(--color-text-primary);
      }
      .city-suggestion .country {
        color: var(--color-text-tertiary);
        font-size: 11px;
        margin-left: 6px;
      }
      @keyframes slideBar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      /* The driver-ride printable block lives in the DOM always so its content
         is print-ready instantly, but it stays hidden on-screen. Print rules
         below toggle whether it OR the full itinerary is captured by
         window.print(), based on whether body has the .printing-rides class. */
      .rides-print-only { display: none; }
      /* Print: hide controls, show the input summary, force colors. */
      @media print {
        html, body { background: #fff !important; overflow: visible !important; }
        body { font-size: 11px; }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .pageBreakAvoid, .day-block, .meal-card, .flight-card, .hotel-card { break-inside: avoid; page-break-inside: avoid; }
        a { color: #000 !important; text-decoration: none !important; }
        /* RIDE-ONLY MODE: when the Print Rides button toggles body.printing-rides,
           overlay the driver sheet on top of the entire page. The simplest
           cross-browser path is fixed-positioning the rides block to cover the
           print area, then visibility-hiding everything else in #root. */
        body.printing-rides #root { visibility: hidden !important; }
        body.printing-rides #rides-print-root,
        body.printing-rides #rides-print-root * { visibility: visible !important; }
        body.printing-rides #rides-print-root {
          display: block !important;
          position: absolute !important;
          inset: 0 !important;
          background: #fff !important;
          z-index: 99999 !important;
        }
        /* Standard print mode hides the rides sheet so it doesn't double-print
           when the user uses the regular Save as PDF / window.print() path. */
        body:not(.printing-rides) .rides-print-only { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
